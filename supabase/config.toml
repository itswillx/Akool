# Configuracao da stack local do Supabase (DEV-006; passo a passo no README,
# secao "Supabase local").
#
# Serve para subir um Postgres/Auth/Storage locais com `supabase start` e
# TESTAR uma migracao antes de aplica-la no remoto. NAO muda nada no projeto
# hospedado — o remoto continua sendo alterado somente via MCP apply_migration.
#
# `supabase db reset` (local) roda TODAS as migracoes de ./migrations na ordem,
# a partir da baseline (20260509000000_baseline_remote_schema.sql, desde
# 10/08), e depois o ./seed.sql com usuarios e dados de exemplo.

project_id = "nhfftophadasiezrzlsv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Espelha o remoto (Postgres 17.6) para que o comportamento local seja fiel.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Captura os e-mails de auth localmente (confirmacao, recuperacao de senha).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[db.seed]
# DEV-006: so no reset LOCAL. O staging (npm run staging:reset) nunca le o seed.
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# Porta do dev server do Vite (ver vite.config.ts).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# SEC-004: mesma política de senha do app (src/lib/passwordPolicy.ts). No
# projeto remoto isto é configurado no painel (Authentication → Policies), junto
# com a "Leaked password protection".
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

# SEC-004: verificação em duas etapas por app autenticador (TOTP).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local: dispensa confirmar e-mail para nao travar o cadastro de teste.
enable_confirmations = false

[analytics]
enabled = false

# site-backup (e cards-api, abaixo) roda com verify_jwt = false: o disparo automatico se
# autentica pelo header `x-cron-secret`, sem JWT nenhum (ver verifyAdmin em
# functions/site-backup/index.ts). O default do CLI e `true`, entao sem esta
# secao um `functions deploy site-backup` sem `--no-verify-jwt` liga a verificacao
# no remoto e mata o backup automatico em silencio.
[functions.site-backup]
verify_jwt = false

# cards-api se autentica por token pessoal (`Bearer akool_pat_…`, hash em
# public.api_tokens), não por JWT do Supabase. Com verify_jwt = true o gateway
# recusaria o token antes de chegar na function.
[functions.cards-api]
verify_jwt = false
