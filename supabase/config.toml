# Configuracao da stack local do Supabase (card ARCH-007).
#
# Serve para subir um Postgres/Auth/Storage locais com `supabase start` e
# TESTAR uma migracao antes de aplica-la no remoto. NAO muda nada no projeto
# hospedado — o remoto continua sendo alterado somente via MCP apply_migration.
#
# ATENCAO: `supabase db reset` (local) roda TODAS as migracoes de
# ./migrations na ordem. Enquanto o baseline nao existir (ver migrations/README.md),
# o banco local sai incompleto — as ~55 migracoes antigas nao estao versionadas.

project_id = "nhfftophadasiezrzlsv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Espelha o remoto (Postgres 17.6) para que o comportamento local seja fiel.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Captura os e-mails de auth localmente (confirmacao, recuperacao de senha).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Porta do dev server do Vite (ver vite.config.ts).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local: dispensa confirmar e-mail para nao travar o cadastro de teste.
enable_confirmations = false

[analytics]
enabled = false

# site-backup e a UNICA function com verify_jwt = false: o disparo automatico se
# autentica pelo header `x-cron-secret`, sem JWT nenhum (ver verifyAdmin em
# functions/site-backup/index.ts). O default do CLI e `true`, entao sem esta
# secao um `functions deploy site-backup` sem `--no-verify-jwt` liga a verificacao
# no remoto e mata o backup automatico em silencio.
[functions.site-backup]
verify_jwt = false
