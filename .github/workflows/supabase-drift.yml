# DEV-005: o Supabase remoto ainda é o que o repositório diz? (functions,
# migrations, retrato do schema e advisors). Só leitura. Roda a cada push na
# main que mexe em supabase/, toda segunda-feira e sob demanda. Precisa do
# segredo SUPABASE_ACCESS_TOKEN; sem ele, avisa e segue.
name: Supabase drift

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/supabase-drift.mjs']
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Projeto (vazio = produção)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN não configurado: check de drift pulado."
            exit 0
          fi
          node scripts/supabase-drift.mjs ${PROJECT_REF:+--project-ref=$PROJECT_REF}
