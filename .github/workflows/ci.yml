# DEV-001: o que precisa passar antes de qualquer deploy (Netlify e Coolify só
# rodam `npm run build`). Os testes não precisam de segredos: o vite.config.ts
# injeta um Supabase fictício no Vitest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para o gitleaks varrer todos os commits.
          fetch-depth: 0

      # SEC-001: segredos no histórico (regras em .gitleaks.toml). Binário oficial
      # com versão e sha256 fixados; --redact nunca imprime o valor encontrado.
      # Achado antigo, já rotacionado, pode ir para o .gitleaksignore (fingerprint).
      - name: Segredos (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (tsc -b)
        run: npx tsc -b

      # ARCH-004: src/types/database.ts em dia com o banco. Precisa do segredo
      # SUPABASE_ACCESS_TOKEN no repositório; sem ele (ou em PR de fork, que não
      # recebe segredos) o passo avisa e segue. O token fica só neste passo.
      - name: Tipos do banco em dia (gen:types --check)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN não configurado: conferência dos tipos do banco pulada."
            exit 0
          fi
          npm run gen:types -- --check

      # Catraca: o projeto tem problemas de lint antigos (scripts/lint-baseline.json);
      # falha só se surgir problema novo.
      - name: Lint (sem problemas novos)
        run: npm run lint:ci

      # QA-001: os testes rodam com cobertura; a trava por pasta
      # (scripts/coverage-baseline.json) falha se alguma pasta cair.
      - name: Testes (com cobertura)
        run: npm run test:coverage

      - name: Build
        run: npx vite build

      # PERF-012: o boot, a entrada e o maior chunk (gzip) não podem crescer mais
      # que 5% sobre scripts/bundle-budget.json. Aumento intencional:
      # `node scripts/bundle-budget.mjs --update` no mesmo PR.
      - name: Orçamento do bundle
        run: node scripts/bundle-budget.mjs

  # QA-003: E2E (Playwright) contra o STAGING (DEV-002). Só roda com os secrets
  # do staging e do usuário de teste; sem eles, avisa e segue. A config recusa
  # rodar se a URL for a da produção.
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - name: Staging configurado?
        id: cfg
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          E2E_USER: ${{ secrets.E2E_USER }}
        run: |
          if [ -z "$STAGING_URL" ] || [ -z "$E2E_USER" ]; then
            echo "::notice::Secrets do staging/E2E não configurados: E2E pulado."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências e o Chromium
        if: steps.cfg.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        if: steps.cfg.outputs.run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ''
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure() && steps.cfg.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
